<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Telefônica</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <i class="fa-solid fa-address-book"></i>
                <h1>Agenda Telefônica</h1>
            </div>
            <p>Gerencie seus contatos facilmente</p>
        </header>

        <main>
            <section class="add-contact-section">
                <h2>Adicionar Novo Contato</h2>
                <form id="contact-form">
                    <div class="input-group">
                        <label for="name">Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="name" placeholder="Ex: João da Silva" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label for="phone">Telefone</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="phone" placeholder="Ex: (11) 98765-4321" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-plus"></i> Adicionar Contato
                    </button>
                </form>
            </section>

            <section class="contacts-list-section">
                <div class="list-header">
                    <h2>Meus Contatos</h2>
                    <span id="contact-count" class="badge">0</span>
                </div>
                
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search" placeholder="Buscar contato...">
                </div>

                <div id="contacts-container" class="contacts-container">
                    <!-- Contatos serão injetados aqui via JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
